[project]
name = "arguebuf"
version = "2.7.2"
description = "Create and analyze argument graphs and serialize them via Protobuf"
readme = "README.md"
requires-python = ">=3.13,<4"
license = "MIT"
authors = [{ name = "Mirko Lenz", email = "mirko@mirkolenz.com" }]
keywords = ["argument-graph", "argument-mining", "argumentation", "nlp", "protobuf"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "arg-services>=2,<3",
  "lxml>=6,<7",
  "networkx>=3,<4",
  "pygraphviz>=2,<3",
]

[project.urls]
Changelog = "https://github.com/recap-utr/arguebuf-python/releases"
Documentation = "https://arguebuf.readthedocs.io"
Issues = "https://github.com/recap-utr/arguebuf-python/issues"
Repository = "https://github.com/recap-utr/arguebuf-python"

[project.scripts]
arguebuf = "arguebuf.cli.app:cli"

[project.optional-dependencies]
cli = ["arg-services[grpcio]>=2,<3", "deepl>=1,<2", "typer>=0.27,<0.28"]

[dependency-groups]
dev = [
  "lxml-stubs>=0.5,<0.6",
  "types-networkx>=3,<4",
  { include-group = "docs" },
  { include-group = "test" },
]
docs = ["pdoc>=16,<17"]
test = [
  "deepdiff>=9,<10",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "pytest-xdist>=3,<4",
]

[build-system]
requires = ["uv-build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest]
addopts = [
  "--numprocesses=auto",
  "--cov=arguebuf",
  "--cov-report=term-missing",
  "--doctest-modules",
  "--ignore=src/arguebuf/cli",
]
doctest_optionflags = ["ELLIPSIS", "IGNORE_EXCEPTION_DETAIL", "NORMALIZE_WHITESPACE"]
testpaths = ["src", "tests"]

[tool.ruff.lint.flake8-bugbear]
# frozen and thus safe to use as default argument
extend-immutable-calls = ["arguebuf.load._config.Config"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv.exclude-newer-package]
arg-services = false
