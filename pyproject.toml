[project]
name = "arguebuf"
version = "4.1.0"
description = "Create and analyze argument graphs and serialize them via Protobuf"
readme = "README.md"
requires-python = ">=3.13,<4"
license = "MIT"
authors = [{ name = "Mirko Lenz", email = "mirko@mirkolenz.com" }]
keywords = ["argument-graph", "argument-mining", "argumentation", "nlp", "protobuf"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "arg-services>=2,<3",
  "fuzzysearch>=0.8,<0.9",
  "networkx>=3,<4",
  "pydantic>=2,<3",
  "pygraphviz>=2,<3",
]

[project.urls]
Changelog = "https://github.com/recap-utr/arguebuf-python/releases"
Documentation = "https://arguebuf.readthedocs.io"
Issues = "https://github.com/recap-utr/arguebuf-python/issues"
Repository = "https://github.com/recap-utr/arguebuf-python"

[project.scripts]
arguebuf = "arguebuf.cli.app:cli"

[project.optional-dependencies]
cli = ["arg-services[grpcio]>=2,<3", "deepl>=1,<2", "typer>=0.27,<0.28"]

[dependency-groups]
dev = [
  "types-networkx>=3,<4",
]
docs = ["pdoc>=16,<17"]
test = [
  "deepdiff>=9,<10",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "pytest-xdist>=3,<4",
]

[build-system]
requires = ["uv-build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.basedpyright]
pythonVersion = "3.13"

[tool.ty.rules]
# ty checks defaults against unsolved type parameters (e.g., `userdata: A = {}`),
# basedpyright checks them at every call against the solved ones (see arguebuf.model.userdata)
invalid-parameter-default = "ignore"

[tool.pytest]
addopts = [
  "--numprocesses=auto",
  "--cov=arguebuf",
  "--cov-report=term-missing",
  "--doctest-modules",
  "--import-mode=importlib",
  "--ignore=src/arguebuf/cli",
]
doctest_optionflags = ["ELLIPSIS", "IGNORE_EXCEPTION_DETAIL", "NORMALIZE_WHITESPACE"]
testpaths = ["src", "tests"]

[tool.uv]
default-groups = ["dev", "docs", "test"]

[tool.uv.extra-build-dependencies]
fuzzysearch = ["setuptools"]

[tool.uv.exclude-newer-package]
arg-services = false
